name: upstream

# 每周检查上游新版本；version 变化时开 PR（ADR 0003），由人合并（ADR 0005）。
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 查询并写回上游版本
        id: upstream
        run: |
          node scripts/vic.mjs upstream --write > upstream.json
          cat upstream.json
          {
            echo 'summary<<EOF'
            node -e '
              const r = require("./upstream.json");
              const up = Object.entries(r.upgrade);
              if (!up.length) { console.log("无上游版本变化"); process.exit(0); }
              for (const [n, v] of up) console.log(`- ${n}: ${v.current.version} → ${v.version} (${v.sha.slice(0, 12)})`);
              console.log("");
              console.log(r.verify.length ? "接线检查失败：\n" + r.verify.map(e => "- " + e).join("\n") + "\n\n请在本分支运行 /vic:vic-sync 修复接线后再合并。" : "接线检查通过。");
            '
            echo EOF
          } >> "$GITHUB_OUTPUT"
          rm upstream.json
      - name: 测试
        run: node --test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/upstream
          title: 升级上游插件
          commit-message: 升级上游插件锁定版本
          body: |
            ${{ steps.upstream.outputs.summary }}

            合并后成员机器的处理：Claude Code 在开启 vic-harness marketplace 自动更新时自动拉取；Codex 重新运行 `node scripts/vic.mjs codex-install`。
