# 规则与示例分离；消费者仅需 MIGRATIONS.md 声明的小型 JSON Schema 子集。
$schema: https://json-schema.org/draft/2020-12/schema
title: vic-harness 项目事实合同 v2
description: YAML 承载 JSON 数据模型；根和子合同使用互斥字段集合。只实现 MIGRATIONS.md 中列出的 JSON Schema 小子集。
anyOf:
- $ref: '#/$defs/rootContract'
- $ref: '#/$defs/appContract'
$defs:
  path:
    type: string
    minLength: 1
    description: 相对仓库根的文件或目录路径；存在性与用户绝对路径由 C02/C06 检查。仅 watch_paths 支持 glob。
  sourcePointer:
    type: object
    additionalProperties: false
    properties:
      path:
        $ref: '#/$defs/path'
      kind:
        type: string
        minLength: 1
    required:
    - path
    - kind
  bootstrapStatus:
    description: 规范输出为含 level 的 v1 对象；scalar 只作兼容输入，不再生成。
    anyOf:
    - type: object
      additionalProperties: false
      properties:
        level:
          type: string
          enum:
          - bootstrap_complete
          - bootstrap_partial_but_usable
          - bootstrap_missing_or_stale
      required:
      - level
    - type: string
      enum:
      - bootstrap_complete
      - bootstrap_partial_but_usable
      - bootstrap_missing_or_stale
  navigation:
    type: object
    additionalProperties: false
    properties:
      agents_md:
        type: object
        additionalProperties: false
        properties:
          path:
            $ref: '#/$defs/path'
          role:
            const: repository_navigation
          line_count:
            type: integer
            minimum: 0
        required:
        - path
      effective_guidance_entry:
        type: object
        additionalProperties: false
        properties:
          path:
            $ref: '#/$defs/path'
          role:
            const: active_guidance_entrypoint
          kind:
            type: string
            enum:
            - agents_override_md
            - agents_md
            - equivalent_navigation
        required:
        - path
      effective_guidance_kind:
        type: object
        additionalProperties: false
        properties:
          value:
            type: string
            enum:
            - agents_override_md
            - agents_md
            - equivalent_navigation
        required:
        - value
      agent_index:
        type: object
        additionalProperties: false
        properties:
          path:
            $ref: '#/$defs/path'
          role:
            const: agent_directory_index
          optional:
            type: boolean
          present:
            type: boolean
        required:
        - path
        description: 只读兼容 v1；新 bootstrap 不生成平行 agent index。optional:true 或 present:false
          免除 C02 存在检查。
      claude_md_bridge:
        type: object
        additionalProperties: false
        properties:
          path:
            $ref: '#/$defs/path'
          present:
            type: boolean
        required:
        - path
        - present
      scoped_guidance:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            path:
              $ref: '#/$defs/path'
            scope:
              $ref: '#/$defs/path'
          required:
          - path
          - scope
    required:
    - agents_md
    - effective_guidance_entry
    - effective_guidance_kind
  module:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
      path:
        $ref: '#/$defs/path'
      role:
        type: string
        minLength: 1
    required:
    - name
    - path
    - role
  uncertainty:
    type: object
    additionalProperties: false
    properties:
      missing_information:
        type: array
        items:
          type: string
          minLength: 1
      inferred_but_unverified:
        type: array
        items:
          type: string
          minLength: 1
    required:
    - missing_information
    - inferred_but_unverified
  agentContext:
    type: object
    additionalProperties: false
    properties:
      canonical_agent_contracts:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            path:
              $ref: '#/$defs/path'
            kind:
              type: string
              minLength: 1
            optional:
              type: boolean
          required:
          - path
          - kind
      multi_agent_readiness:
        type: object
        additionalProperties: false
        properties:
          ownership_boundaries_clear:
            type: boolean
          guarded_paths_defined:
            type: boolean
          bootstrap_layer_complete:
            type: boolean
        required:
        - ownership_boundaries_clear
        - guarded_paths_defined
        - bootstrap_layer_complete
    required:
    - canonical_agent_contracts
    - multi_agent_readiness
    description: 仅事实前提；禁止 ready_for_multi_agent/use_multi_agent 等运行判断。
  guardedPath:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: ^GP-[A-Za-z0-9][A-Za-z0-9._-]*$
      path:
        $ref: '#/$defs/path'
      reason:
        type: string
        minLength: 1
      evidence:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
      origin:
        type: string
        pattern: ^(repo-scan|ua-graph|user|incident:[^\r\n]+|retro:\d{4}-\d{2}-\d{2})$
      confidence:
        type: string
        enum:
        - verified
        - inferred
      status:
        type: string
        enum:
        - active
        - probation
        - retired
      added:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      last_confirmed:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
    required:
    - id
    - path
    - reason
    - evidence
    - confidence
    description: M1 要求稳定 ID、业务字段、evidence/confidence；M2 的 origin/status/added 由 C10
      校验，last_confirmed 可选。ID 在一份根合同及其所有子合同集合中唯一；JSON Schema 不执行跨文件查重。
  validationGate:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: ^VG-[A-Za-z0-9][A-Za-z0-9._-]*$
      name:
        type: string
        minLength: 1
      command:
        type: string
        minLength: 1
      command_hint:
        type: string
        minLength: 1
        description: v1 只读别名，保留一个大版本；新输出用 command。两者同现时必须一致。
      verified:
        type: boolean
      verified_at_commit:
        type: string
        pattern: ^[0-9a-f]{7,40}$
      exit_code:
        type: integer
      evidence:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
      origin:
        type: string
        pattern: ^(repo-scan|ua-graph|user|incident:[^\r\n]+|retro:\d{4}-\d{2}-\d{2})$
      confidence:
        type: string
        enum:
        - verified
        - inferred
      status:
        type: string
        enum:
        - active
        - probation
        - retired
      added:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      last_confirmed:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
    required:
    - id
    - name
    - evidence
    - confidence
    description: M1 要求稳定 ID、业务字段、evidence/confidence；M2 的 origin/status/added 由 C10
      校验，last_confirmed 可选。ID 在一份根合同及其所有子合同集合中唯一；JSON Schema 不执行跨文件查重。
    anyOf:
    - required:
      - command
    - required:
      - command_hint
  conventionRule:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: ^CR-[A-Za-z0-9][A-Za-z0-9._-]*$
      rule:
        type: string
        minLength: 1
      evidence:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
      origin:
        type: string
        pattern: ^(repo-scan|ua-graph|user|incident:[^\r\n]+|retro:\d{4}-\d{2}-\d{2})$
      confidence:
        type: string
        enum:
        - verified
        - inferred
      status:
        type: string
        enum:
        - active
        - probation
        - retired
      added:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      last_confirmed:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
    required:
    - id
    - rule
    - evidence
    - confidence
    description: M1 要求稳定 ID、业务字段、evidence/confidence；M2 的 origin/status/added 由 C10
      校验，last_confirmed 可选。ID 在一份根合同及其所有子合同集合中唯一；JSON Schema 不执行跨文件查重。
  preferredAbstraction:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: ^PA-[A-Za-z0-9][A-Za-z0-9._-]*$
      name:
        type: string
        minLength: 1
      path:
        $ref: '#/$defs/path'
      import:
        type: string
        minLength: 1
      entry:
        $ref: '#/$defs/path'
      source:
        $ref: '#/$defs/path'
      exports:
        type: array
        items:
          type: string
          minLength: 1
      use_instead_of:
        type: array
        items:
          type: string
          minLength: 1
      evidence:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
      origin:
        type: string
        pattern: ^(repo-scan|ua-graph|user|incident:[^\r\n]+|retro:\d{4}-\d{2}-\d{2})$
      confidence:
        type: string
        enum:
        - verified
        - inferred
      status:
        type: string
        enum:
        - active
        - probation
        - retired
      added:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      last_confirmed:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
    required:
    - id
    - name
    - path
    - use_instead_of
    - evidence
    - confidence
    description: M1 要求稳定 ID、业务字段、evidence/confidence；M2 的 origin/status/added 由 C10
      校验，last_confirmed 可选。ID 在一份根合同及其所有子合同集合中唯一；JSON Schema 不执行跨文件查重。
  locateEntry:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: ^LI-[A-Za-z0-9][A-Za-z0-9._-]*$
      scenario:
        type: string
        minLength: 1
      import:
        type: string
        minLength: 1
      entry:
        $ref: '#/$defs/path'
      source:
        $ref: '#/$defs/path'
      exports:
        type: array
        items:
          type: string
          minLength: 1
      evidence:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
      origin:
        type: string
        pattern: ^(repo-scan|ua-graph|user|incident:[^\r\n]+|retro:\d{4}-\d{2}-\d{2})$
      confidence:
        type: string
        enum:
        - verified
        - inferred
      status:
        type: string
        enum:
        - active
        - probation
        - retired
      added:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      last_confirmed:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
    required:
    - id
    - scenario
    - entry
    - source
    - exports
    - evidence
    - confidence
    description: M1 要求稳定 ID、业务字段、evidence/confidence；M2 的 origin/status/added 由 C10
      校验，last_confirmed 可选。ID 在一份根合同及其所有子合同集合中唯一；JSON Schema 不执行跨文件查重。
  projectMap:
    type: object
    additionalProperties: false
    properties:
      repo_type:
        type: string
        minLength: 1
      workspace_mode:
        type: string
        minLength: 1
      top_level_modules:
        type: array
        items:
          $ref: '#/$defs/module'
      guarded_paths:
        type: array
        items:
          $ref: '#/$defs/guardedPath'
      entry_chain:
        type: array
        items:
          $ref: '#/$defs/path'
    required:
    - repo_type
    - workspace_mode
    - top_level_modules
    - guarded_paths
    description: entry_chain 是入口到核心处理链路的有序路径，主要用于子合同；不复制根合同事实。
  conventions:
    type: object
    additionalProperties: false
    properties:
      sources:
        type: array
        items:
          $ref: '#/$defs/sourcePointer'
      validation_gates:
        type: array
        items:
          $ref: '#/$defs/validationGate'
      rules:
        type: array
        items:
          $ref: '#/$defs/conventionRule'
    required:
    - sources
    - validation_gates
  components:
    type: object
    additionalProperties: false
    properties:
      sources:
        type: array
        items:
          $ref: '#/$defs/sourcePointer'
      systems:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
            path:
              $ref: '#/$defs/path'
            preferred:
              type: boolean
          required:
          - name
          - path
          - preferred
      preferred_abstractions:
        type: array
        items:
          $ref: '#/$defs/preferredAbstraction'
      locate_index:
        type: array
        items:
          $ref: '#/$defs/locateEntry'
      locate_order:
        type: array
        items:
          $ref: '#/$defs/path'
      search_commands:
        type: array
        items:
          type: string
          minLength: 1
    required:
    - sources
    - systems
    - preferred_abstractions
  integrations:
    type: object
    additionalProperties: false
    properties:
      domain_docs:
        type: object
        additionalProperties: false
        properties:
          detected:
            type: boolean
          glossary:
            $ref: '#/$defs/path'
          adr_dir:
            $ref: '#/$defs/path'
          owner:
            type: string
            minLength: 1
        required:
        - detected
        - owner
      review_rules:
        type: object
        additionalProperties: false
        properties:
          detected:
            type: boolean
          path:
            $ref: '#/$defs/path'
          owner:
            type: string
            minLength: 1
        required:
        - detected
        - owner
      skills_config:
        type: object
        additionalProperties: false
        properties:
          detected:
            type: boolean
          dir:
            $ref: '#/$defs/path'
          owner:
            type: string
            minLength: 1
        required:
        - detected
        - owner
      knowledge_graph:
        type: object
        additionalProperties: false
        properties:
          detected:
            type: boolean
          path:
            $ref: '#/$defs/path'
          owner:
            type: string
            minLength: 1
          canonical:
            type: boolean
          query_via:
            type: string
            minLength: 1
        required:
        - detected
        - owner
      agent_config:
        type: object
        additionalProperties: false
        properties:
          detected:
            type: boolean
          config:
            $ref: '#/$defs/path'
          agents_dir:
            $ref: '#/$defs/path'
          owner:
            const: vic-agents
        required:
        - detected
        - owner
    description: 仅检测状态和所有权指针。detected:false 的整组指针不要求存在；UA 未核实事实必须 inferred。
  rootContract:
    type: object
    additionalProperties: false
    properties:
      version:
        const: 1
        description: v1 兼容标记；合同格式以 schema_version 为准。
      schema_version:
        const: 2
      refreshed_at_commit:
        type: string
        pattern: ^[0-9a-f]{7,40}$
      watch_paths:
        type: array
        items:
          $ref: '#/$defs/path'
        description: 唯一支持 glob 的路径列表；M2 过期检测。
      project_map:
        $ref: '#/$defs/projectMap'
      conventions:
        $ref: '#/$defs/conventions'
      component_contract:
        $ref: '#/$defs/components'
      uncertainty:
        $ref: '#/$defs/uncertainty'
      generated_by:
        type: object
        additionalProperties: false
        properties:
          plugin:
            const: vic-harness
          plugin_version:
            type: string
            minLength: 1
        required:
        - plugin
        - plugin_version
      refreshed_at:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      bootstrap_status:
        $ref: '#/$defs/bootstrapStatus'
      navigation_layer:
        $ref: '#/$defs/navigation'
      apps:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
            path:
              $ref: '#/$defs/path'
            contract:
              $ref: '#/$defs/path'
            docs:
              $ref: '#/$defs/path'
          required:
          - name
          - path
          - contract
          - docs
      integrations:
        $ref: '#/$defs/integrations'
      foreign_sections:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            file:
              $ref: '#/$defs/path'
            heading:
              type: string
              minLength: 1
            owner:
              type: string
              minLength: 1
          required:
          - file
          - heading
          - owner
      agent_context:
        $ref: '#/$defs/agentContext'
      non_goals:
        type: array
        items:
          type: string
          minLength: 1
    required:
    - version
    - schema_version
    - bootstrap_status
    - navigation_layer
    - project_map
    - conventions
    - component_contract
    - agent_context
    - uncertainty
    - non_goals
    description: 根合同；无 parent。M2 的 generated_by/refreshed_at/refreshed_at_commit/watch_paths/integrations/foreign_sections
      可选。
  appContract:
    type: object
    additionalProperties: false
    properties:
      parent:
        const: contracts/project-context.yaml
      schema_version:
        const: 2
      refreshed_at_commit:
        type: string
        pattern: ^[0-9a-f]{7,40}$
      watch_paths:
        type: array
        items:
          $ref: '#/$defs/path'
        description: 唯一支持 glob 的路径列表；M2 过期检测。
      project_map:
        $ref: '#/$defs/projectMap'
      conventions:
        $ref: '#/$defs/conventions'
      component_contract:
        $ref: '#/$defs/components'
      uncertainty:
        $ref: '#/$defs/uncertainty'
    required:
    - parent
    - schema_version
    - project_map
    - conventions
    - component_contract
    - uncertainty
    description: 子应用合同，仅此子集；parent 是相对仓库根的根合同指针。M1 不强制 M2 基准与 watch_paths。
