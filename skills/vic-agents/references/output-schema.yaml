# 本技能的回复摘要模板，不是 Codex 配置 schema，也不默认写入仓库。
# 根据实际证据填值；yes/no/conditional 等枚举保持字符串。
# 所有状态仅属本次判断，不能回写项目事实合同。
project_mode: small-feature # small-feature | medium-large-feature | refactor | bugfix | research | pr-review
project_context_source: repo-scan # repo-scan | project-context | mixed | unknown
initialized_project: "unknown" # yes | no | unknown
initialization_required: "no" # yes | no | conditional
ready_for_multi_agent: "conditional" # yes | no | conditional
use_multi_agent: "no" # yes | no | conditional；描述目标工作流，不是配置编辑过程

# 兼容旧摘要消费者；仅表示本次仍缺少委派触发，不代表产品只接受用户显式调用。
requires_explicit_codex_multiagent_invocation: "no" # yes | no
delegation:
  trigger: none # user-request | applicable-instructions | ultra | none | unknown
  execution_status: not-started # 本技能默认只配置
  rationale: 当前任务没有独立委派收益

model_policy:
  strategy: inherit # inherit | explicit | mixed
  checked_at: null # 本轮实际官方核验日期；仅读快照时保留 null，不复制快照或运行日期
  official_sources: [] # 本轮实际核验的官方 URL；本地快照路径/日期放 rationale 或 uncertainty
  client_availability: unknown # verified | partial | unknown
  rationale: 用户指定优先，保留现有有效模型和推理设置
  uncertainty: [] # 账户可用性、快照版本、模型/推理兼容等未确认项

materialization:
  mode: repo-local # repo-local | draft-only
  config_path: .codex/config.toml
  agents_dir: .codex/agents
  write_policy: incremental-refresh # incremental-refresh | create-missing
  official_format: toml
  status: unchanged # unchanged | written | draft-only | blocked
  runtime_loaded: "unknown" # yes | no | unknown

repo_local_artifacts:
  config:
    path: .codex/config.toml
    required: "no" # 无需全局变更时可以不存在
    action: unchanged # created | updated | unchanged | not-needed
  guidance_bridge:
    path: .codex/AGENTS.md
    required: "no"
    action: not-needed
    role: superpowers_guidance_bridge
  custom_agents: [] # 仅列实际创建或更新的文件及 action

superpowers_integration:
  status: unknown # user-confirmed | user-denied | unknown
  evidence_source: none # user-confirmation | user-explicit-request | repo-signal-only | existing-bridge | none
  bridge_materialization_allowed: "no" # yes | no
  notes: 未确认集成，跳过可选 bridge 并继续处理官方 TOML

capability_inventory:
  status: partial # complete | partial | unknown
  sources: [] # 关键 available 的当前工具/宿主声明等可定位证据；计划/安装/配置本身不足
  # 各项沿用字符串列表，在说明中分开可用、允许、已启动和权限验证；缺证据归 missing_but_relevant
  # 未启动不等于不可用；只有实际添加计划才用 planned_additions，不为盘点 spawn/runtime 验证
  tools:
    available: []
    missing_but_relevant: []
    planned_additions: []
  skills:
    available: []
    missing_but_relevant: []
    planned_additions: []
  mcp:
    available: []
    missing_but_relevant: []
    planned_additions: []
  runtimes:
    available: []
    missing_but_relevant: []
    planned_additions: []

recommended_topology:
  label: single-agent # single-agent | staged-pair | parallel-read | explicit-expanded
  main_session_role: implementer
  rationale: 主会话足以完成任务，新增角色没有独立收益

minimal_setup:
  label: single-agent
  agent_count: 1 # 包含主会话
  topology: single-agent
  apply_when:
    - 改动局部且没有可独立委派的工作
  upgrade_when:
    - 独立证据收集或评审能节省时间或提高质量

enhanced_setup:
  label: implementer-plus-reviewer
  agent_count: 2 # 包含主会话，只是条件备选
  topology: staged-pair
  apply_when:
    - 存在能具体说明的独立评审收益

main_session:
  role: implementer
  runtime_class: current-session
  materialized_path: null # 主会话不绑定 custom agent 文件

active_agents: [] # 仅计划委派的子代理；不表示已启动，不包含主会话
# 有子代理时列 name、kind（built-in/custom）、run_mode（spawned）、
# runtime_class（isolated-child，指上下文隔离）、owned_scope、purpose、
# materialized_path（built-in 时 null），及必要的模型和能力约束。
custom_agent_files: [] # 仅有理由持久化的 custom agent；不为 built-in 生成文件

evidence_requirements:
  implementer:
    minimum:
      - 明确的任务范围和实际变更
      - 支撑完成结论的验证结果
  reviewer:
    minimum:
      - 实际检查的范围与证据
      - 具体发现或无发现结论，以及尚未验证的风险

evaluation:
  stage_evaluations:
    - stage: configuration
      owner: main-session
      success_metrics:
        - 变更 TOML 可解析，字段和模型有依据
        - 无关配置保留，产物清单与实际差异一致
      verification_commands: [] # 填实际 --agents 命令及结果；失败如实报告，零文件变更时报告差异证据
  topology_evaluation:
    owner: main-session
    compare_against_baseline: "conditional"
    success_metrics:
      - 每个新增角色都有超过协调成本的明确收益

guardrails:
  global:
    max_agents: 4 # 本技能建议的总规模，不是官方上限
    max_concurrent_subagents: 0 # 本次使用预算，不等于项目持久容量；不因此降低已有上限或生成并发数 0
    approval_boundaries:
      - 沿用已有授权，只在新增破坏性或外部操作超出授权时确认
  per_agent: [] # 按需要写范围、证据与实际权限限制，不是任意 TOML 字段

human_checkpoints:
  required: "no" # yes | no | conditional
  checkpoints: []

refresh_policy:
  rerun_when_capabilities_change: "yes"
  rerun_mode: incremental
  triggers:
    - 能力或客户端支持发生影响当前配置的变化
    - 用户请求模型迁移或配置更新
  refresh_sections:
    - capability_inventory
    - model_policy
    - materialization
    - repo_local_artifacts
    - custom_agent_files
    - guardrails

# M1 不写 refresh-log。未来 agents 真正 no-op 也不创建 contracts 或日志。
# 自定义/未知合同 schema 保留原件，相关事实回源码核对；未知历史配置失败如实报告并路由。
# 配置生成不启动业务任务，也不生成该摘要的第二套仓库 manifest。
