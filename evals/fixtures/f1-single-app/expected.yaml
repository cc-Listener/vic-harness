# M1 只检查当前能力；不要求 M2 来源字段、watch_paths、日志或 integrations。
files_exist:
  - AGENTS.md
  - docs/project-map.md
  - docs/conventions.md
  - docs/component-contract.md
  - contracts/project-context.yaml
files_absent:
  - .codex/agents/topology.yaml
  - .codex/agents/roles
  - .codex/agents/bridges
max_lines: { AGENTS.md: 120 }
vic_check: { error: 0 }
idempotent: true
# M1 第二次运行须保持真实文件树不变，包括未跟踪和忽略文件。
git_diff_only: []
files_unchanged:
  - package.json
  - tsconfig.json
  - vite.config.ts
  - vitest.config.ts
  - eslint.config.js
  - .env.production
  - src/ui/index.ts
  - src/ui/AppButton.tsx
  - src/ui/AppModal.tsx
  - src/request/interceptors.ts
yaml_paths:
  - { path: 'component_contract.preferred_abstractions[*].import', contains: '@/ui' }
  - { path: 'component_contract.preferred_abstractions[*].exports[*]', contains: AppButton }
  - { path: 'component_contract.preferred_abstractions[*].exports[*]', contains: AppModal }
  - { path: 'project_map.guarded_paths[*].path', contains: src/request/interceptors.ts }
  - { path: 'project_map.guarded_paths[*].path', contains: .env.production }
  - { path: 'conventions.validation_gates[*].command', contains: 'npm run lint' }
  - { path: 'conventions.validation_gates[*].command', contains: 'npm run typecheck' }
  - { path: 'component_contract.locate_index[*].source', contains: src/ui/AppButton.tsx }
forbidden_text:
  - { glob: 'docs/**/*.md', pattern: 'Next\.js' }
