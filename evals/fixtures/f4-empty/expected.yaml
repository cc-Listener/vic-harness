# M1 只检查当前能力；不要求 M2 来源字段、watch_paths、日志或 integrations。
files_exist:
  - AGENTS.md
  - docs/project-map.md
  - docs/conventions.md
  - docs/component-contract.md
  - contracts/project-context.yaml
files_absent:
  - .codex/agents/topology.yaml
  - .codex/agents/roles
  - .codex/agents/bridges
max_lines: { AGENTS.md: 120 }
vic_check: { error: 0 }
idempotent: true
# M1 第二次运行须保持真实文件树不变，包括未跟踪和忽略文件。
git_diff_only: []
files_unchanged: [README.md, main.py]
yaml_paths:
  - { path: 'uncertainty.missing_information', not_empty: true }
  - { path: 'component_contract.preferred_abstractions', equals: [] }
  - { path: 'component_contract.systems', equals: [] }
  - { path: 'conventions.validation_gates', equals: [] }
forbidden_text:
  - { glob: 'docs/**/*.md', pattern: 'Next\.js|@/ui|@acme/ui|pnpm lint|npm run lint' }
  - { glob: 'contracts/**/*.yaml', pattern: 'Next\.js|@/ui|@acme/ui|pnpm lint|npm run lint' }
